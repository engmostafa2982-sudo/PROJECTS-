name: Convert uploads to Markdown and update tracker

on:
  push:
    branches: [main]
    paths:
      - "**/All Files/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-weekly-reports
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converters
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ara poppler-utils
          pip install "markitdown[all]==0.1.9" pillow-heif

      - name: Convert new or changed files
        run: python .github/scripts/convert_to_md.py

      - name: Update upload tracker
        if: always()
        run: python .github/scripts/update_tracker.py

      - name: Commit Markdown files and tracker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/MD Files/**' README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Convert uploads to Markdown and update tracker"
          git pull --rebase origin main
          git push origin HEAD:main
