name: Convert uploads to Markdown and update tracker

on:
  push:
    branches: [main]
    paths:
      - "**/All Files/**"
      - "**/4-Weekly update/**"
      - "**/Generated Report/**"
      - ".github/scripts/**"
      - ".github/workflows/convert-weekly-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-weekly-reports
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install converters
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ara poppler-utils
          pip install "markitdown[all]==0.1.9" openpyxl pillow-heif

      - name: Convert files and update tracker, saving progress as it goes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          while true; do
            status=0
            python .github/scripts/weeks.py
            python .github/scripts/convert_to_md.py --budget 1500 || status=$?
            python .github/scripts/update_tracker.py
            git add -A -- ':(glob)**/4-Weekly update/**' ':(glob)**/MD Files/**' README.md
            if ! git diff --cached --quiet; then
              git commit -q -m "Convert uploads to Markdown and update tracker"
              # Another run or an upload may have pushed meanwhile: if the rebase fails, start this pass again
              # from the latest main (conversion is repeatable), instead of failing.
              if ! git pull --rebase -X theirs origin main || ! git push origin HEAD:main; then
                git rebase --abort 2>/dev/null || true
                git fetch -q origin main && git reset -q --hard origin/main
                tries=$((${tries:-0} + 1)); [ "$tries" -le 5 ] && continue
                exit 1
              fi
            fi
            [ "$status" -eq 3 ] || exit "$status"
          done
